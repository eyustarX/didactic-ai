<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="780"/>
    <line x1="300" y1="0" x2="300" y2="780"/>
    <line x1="500" y1="0" x2="500" y2="780"/>
    <line x1="700" y1="0" x2="700" y2="780"/>
    <line x1="900" y1="0" x2="900" y2="780"/>
    <line x1="1100" y1="0" x2="1100" y2="780"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 36)">
    <rect width="44" height="44" rx="10" fill="#3b82f6" opacity="0.15"/>
    <path d="M 14 30 L 22 14 L 30 30 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="22" cy="23" r="2.5" fill="#38bdf8"/>
    
    <text x="56" y="22" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.02em">Didactic AI - Cloud-Native System Architecture</text>
    <text x="56" y="39" fill="#94a3b8" font-size="12" font-weight="500">AWS Community Day 2026 Hackathon | Team Mavericks | 100% Serverless &amp; $0.00 Free-Tier Verified</text>
  </g>

  <!-- Tag Pills Right -->
  <g transform="translate(860, 42)">
    <rect width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">AWS SAM / IaC</text>

    <rect x="140" width="140" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="152" cy="13" r="3.5" fill="#34d399"/>
    <text x="215" y="17" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">$1.00 Budget Cap</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. PRESENTATION LAYER (CLIENT) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 110)">
    <rect width="240" height="480" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="14" fill="#182238" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.05em">1. CLIENT LAYER</text>

    <!-- Sub-boxes -->
    <!-- Web App -->
    <g transform="translate(16, 60)">
      <rect width="208" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-size="13" font-weight="600">React + Vite Web App</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">• Dual-Pane Assessment Studio</text>
      <text x="14" y="62" fill="#94a3b8" font-size="11">• Interactive Copilot Workspace</text>
      <text x="14" y="80" fill="#94a3b8" font-size="11">• Real-Time Grading Canvas</text>
    </g>

    <!-- Hosting -->
    <g transform="translate(16, 172)">
      <rect width="208" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="600">Hosting Options</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">• Amazon S3 + CloudFront</text>
      <text x="14" y="62" fill="#94a3b8" font-size="11">• Hugging Face / Vercel Edge</text>
    </g>

    <!-- Lecturer & Student Personas -->
    <g transform="translate(16, 268)">
      <rect width="208" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#e2e8f0" font-size="12" font-weight="600">Target User Personas</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">👨‍🏫 Lecturer: Upload &amp; Rubrics</text>
      <text x="14" y="64" fill="#94a3b8" font-size="11">🎓 Student: Answers &amp; Feedback</text>
      <text x="14" y="84" fill="#94a3b8" font-size="11">📊 Deans: Cohort Bottlenecks</text>
    </g>

    <!-- Security Auth -->
    <g transform="translate(16, 380)">
      <rect width="208" height="80" rx="10" fill="#0b1329" stroke="#1d4ed8" stroke-width="1"/>
      <text x="14" y="24" fill="#60a5fa" font-size="11" font-weight="700">Deterministic Auth</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">• Zero-password ID mapping</text>
      <text x="14" y="60" fill="#94a3b8" font-size="10">• Auto-attaches `usr_byz6ij`</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. INGRESS & ROUTING (API GATEWAY) -->
  <!-- ========================================================================= -->
  <g transform="translate(350, 190)">
    <rect width="180" height="320" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="42" rx="14" fill="#182238" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.05em">2. INGRESS &amp; API</text>

    <g transform="translate(14, 60)">
      <rect width="152" height="60" rx="8" fill="#0f172a" stroke="#ff9900" stroke-width="1"/>
      <text x="12" y="22" fill="#ffb84d" font-size="11" font-weight="700">Amazon API Gateway</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">HTTP API (v2)</text>
      <text x="12" y="50" fill="#64748b" font-size="9">CORS Preflight &amp; JWT/Key</text>
    </g>

    <!-- Route Endpoints -->
    <g transform="translate(14, 134)">
      <rect width="152" height="156" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#cbd5e1" font-size="10" font-weight="700">Rest API Routes</text>
      <text x="12" y="40" fill="#38bdf8" font-size="10">POST /upload</text>
      <text x="12" y="60" fill="#38bdf8" font-size="10">POST /generate/*</text>
      <text x="12" y="80" fill="#38bdf8" font-size="10">POST /grade/*</text>
      <text x="12" y="100" fill="#38bdf8" font-size="10">GET /analytics</text>
      <text x="12" y="120" fill="#38bdf8" font-size="10">GET /chat/sessions</text>
      <text x="12" y="140" fill="#38bdf8" font-size="10">GET /metrics</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. COMPUTE & AI CORE (LAMBDA / FASTAPI) -->
  <!-- ========================================================================= -->
  <g transform="translate(580, 110)">
    <rect width="270" height="480" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="270" height="42" rx="14" fill="#182238" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.05em">3. COMPUTE &amp; ORCHESTRATION</text>

    <!-- Lambda / FastAPI Function -->
    <g transform="translate(16, 56)">
      <rect width="238" height="64" rx="8" fill="#0f172a" stroke="#ff9900" stroke-width="1.2"/>
      <text x="14" y="22" fill="#ffb84d" font-size="12" font-weight="700">AWS Lambda / FastAPI</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">Python 3.11 Runtime | 1024 MB</text>
      <text x="14" y="52" fill="#64748b" font-size="9">IAM Least-Privilege Execution Role</text>
    </g>

    <!-- Sub-engines inside Compute -->
    <g transform="translate(16, 130)">
      <rect width="238" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="600">Curriculum Ingestion Engine</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• PDF/PPTX/Text semantic extraction</text>
      <text x="14" y="54" fill="#94a3b8" font-size="10">• Chunker (300 words, 50 overlap)</text>
    </g>

    <g transform="translate(16, 208)">
      <rect width="238" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#a78bfa" font-size="11" font-weight="600">RAG Dense Embedding Pipeline</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• all-mpnet-base-v2 / Titan</text>
      <text x="14" y="54" fill="#94a3b8" font-size="10">• Cosine similarity top-k search</text>
    </g>

    <g transform="translate(16, 286)">
      <rect width="238" height="74" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#38bdf8" font-size="11" font-weight="600">Decomposed Grading Agent</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• Criterion citation extraction</text>
      <text x="14" y="52" fill="#94a3b8" font-size="10">• Strengths, gaps &amp; remediation Q</text>
      <text x="14" y="66" fill="#94a3b8" font-size="10">• Adversarial injection guardrails</text>
    </g>

    <g transform="translate(16, 370)">
      <rect width="238" height="88" rx="8" fill="#091428" stroke="#1d4ed8" stroke-width="1"/>
      <text x="14" y="20" fill="#60a5fa" font-size="11" font-weight="700">Pydantic Guardrails &amp; Retries</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• 100% strict JSON schema validation</text>
      <text x="14" y="54" fill="#94a3b8" font-size="10">• Auto-retry loop (max 2 retries)</text>
      <text x="14" y="70" fill="#94a3b8" font-size="10">• Weights normalize to 100% sum</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. PERSISTENCE & AI SERVICES (RIGHT COLUMN) -->
  <!-- ========================================================================= -->
  <g transform="translate(900, 110)">
    <rect width="240" height="480" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="14" fill="#182238" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.05em">4. PERSISTENCE &amp; AI</text>

    <!-- S3 -->
    <g transform="translate(16, 56)">
      <rect width="208" height="80" rx="8" fill="#0f172a" stroke="#ff9900" stroke-width="1"/>
      <text x="12" y="22" fill="#ffb84d" font-size="11" font-weight="700">Amazon S3 Bucket</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">AES-256 Encrypted</text>
      <text x="12" y="52" fill="#94a3b8" font-size="10">• Raw lecture PDFs &amp; PPTX</text>
      <text x="12" y="66" fill="#94a3b8" font-size="10">• Cleaned text chunks</text>
    </g>

    <!-- DynamoDB / PostgreSQL -->
    <g transform="translate(16, 148)">
      <rect width="208" height="96" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="12" y="22" fill="#60a5fa" font-size="11" font-weight="700">Amazon DynamoDB / Neon</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">On-Demand Capacity (Free)</text>
      <text x="12" y="54" fill="#94a3b8" font-size="10">• Canonical Rubrics (100% sum)</text>
      <text x="12" y="68" fill="#94a3b8" font-size="10">• Question Banks &amp; Answer Keys</text>
      <text x="12" y="82" fill="#94a3b8" font-size="10">• Submissions &amp; Gradebooks</text>
    </g>

    <!-- Amazon Bedrock -->
    <g transform="translate(16, 256)">
      <rect width="208" height="110" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="12" y="22" fill="#c084fc" font-size="11" font-weight="700">Amazon Bedrock</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">• Claude 3 Haiku (0.2 temp)</text>
      <text x="12" y="54" fill="#94a3b8" font-size="10">• Titan Multimodal Embeddings</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10">• Free Trial Credit Compliant</text>
      <text x="12" y="86" fill="#a78bfa" font-size="10">Fallback: Gemini / Offline Sim</text>
    </g>

    <!-- CloudWatch & Budgets -->
    <g transform="translate(16, 378)">
      <rect width="208" height="86" rx="8" fill="#052e16" stroke="#059669" stroke-width="1"/>
      <text x="12" y="20" fill="#34d399" font-size="11" font-weight="700">Amazon CloudWatch</text>
      <text x="12" y="36" fill="#a7f3d0" font-size="10">Active $1.00 Budget Alarm</text>
      <text x="12" y="52" fill="#a7f3d0" font-size="10">• Invocation &amp; Error Rate Logs</text>
      <text x="12" y="68" fill="#a7f3d0" font-size="10">• Latency p95 Telemetry</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. BOTTOM BAR: METRICS & ZERO-COST GUARANTEE -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 620)">
    <rect width="1080" height="120" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Item 1: Variance -->
    <g transform="translate(30, 24)">
      <text x="0" y="20" fill="#94a3b8" font-size="11" font-weight="600">GRADING CONSISTENCY</text>
      <text x="0" y="52" fill="#34d399" font-size="28" font-weight="700">σ = 0.000</text>
      <text x="0" y="74" fill="#64748b" font-size="11">Zero fatigue drift across runs</text>
    </g>

    <line x1="260" y1="20" x2="260" y2="100" stroke="#1e293b" stroke-width="1"/>

    <!-- Item 2: Adherence -->
    <g transform="translate(300, 24)">
      <text x="0" y="20" fill="#94a3b8" font-size="11" font-weight="600">CRITERION ADHERENCE</text>
      <text x="0" y="52" fill="#38bdf8" font-size="28" font-weight="700">100.0%</text>
      <text x="0" y="74" fill="#64748b" font-size="11">0 hallucinated criteria</text>
    </g>

    <line x1="530" y1="20" x2="530" y2="100" stroke="#1e293b" stroke-width="1"/>

    <!-- Item 3: Security -->
    <g transform="translate(570, 24)">
      <text x="0" y="20" fill="#94a3b8" font-size="11" font-weight="600">INJECTION SAFETY</text>
      <text x="0" y="52" fill="#a78bfa" font-size="28" font-weight="700">5 / 5 Safe</text>
      <text x="0" y="74" fill="#64748b" font-size="11">Jailbreaks &amp; empty inputs: 0.0/10</text>
    </g>

    <line x1="800" y1="20" x2="800" y2="100" stroke="#1e293b" stroke-width="1"/>

    <!-- Item 4: Cloud Cost -->
    <g transform="translate(840, 24)">
      <text x="0" y="20" fill="#94a3b8" font-size="11" font-weight="600">ESTIMATED CLOUD COST</text>
      <text x="0" y="52" fill="#fbbf24" font-size="28" font-weight="700">$0.00</text>
      <text x="0" y="74" fill="#64748b" font-size="11">100% AWS Free Tier Compliant</text>
    </g>
  </g>

  <!-- Flow Arrows connecting the blocks -->
  <!-- 1 -> 2 -->
  <path d="M 300 350 L 344 350" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- 2 -> 3 -->
  <path d="M 530 350 L 574 350" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- 3 -> 4 (Bedrock) -->
  <path d="M 850 350 L 894 350" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  
  <!-- 3 -> 4 (S3) -->
  <path d="M 850 180 L 894 180" fill="none" stroke="#ff9900" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -> 4 (DynamoDB) -->
  <path d="M 850 240 L 894 240" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
